# Agent spec: the helper we will build
#
# Fill this in from your agent card. Each "# Card:" line names the card field it comes from.
# Composite scenarios only: no real names or student records. Replace PII with synthetic information.
#
# YAML tips:
#   - Indent with spaces, never tabs. Keep the indentation shown here.
#   - Put text in "double quotes", especially text containing a colon (:) or a hash (#).
#   - Write "Yes" and "No" in quotes, otherwise they may be read as true/false.
#   - Add list items as new lines starting with "- ". Delete empty "" items you don't use.

# Card: Helper name / Group / Scenario / Helper # (from crew sheet)
helperName: "My operation captain"
group: "5"
scenario: ""
helperNumber: "1"

# Who the learner is and the moment this helper is for (from your moment sheet).
learnerAndMoment: ""

# Card: How we would know it worked. From: Desired outcome.
# What would be true for the learner? Make it something you could observe.
desiredOutcome: "Not feel overwhelmed, "
successMeasure: "1) student - ready for next day, they feel prepare, and supported, "

# Card: When it starts. From: Signals. What makes the helper begin?
trigger: "Student in conjuction with aprent/caregiver identified need for support before going to school on monday. Parent or caregiver observed child being angry unresposiveness."

# Card: What it uses. From: Inputs. What information or materials does it need?
allowedInputs:
  - "student scheudle, teacher names, course syllabus, caourse calendar, tutorial links within their for subjects"
  - "medication schedule"
  - "general school respources, schol map, where are bathrooms, libraries, rest room cafeteria"

# Information the helper must NOT use, even if it is available.
prohibitedInputs:
  - "names of other students"
  - "medical information PIIs"
  - "summarization of medical tests - example okay to know that the kid is tired or had a reaction and neeed bed rest but not atcual medication name, test name etc information"

# Card: What it may know about the learner. From: the learner profile.
# Only lines the student marked "Yes". Leave everything else out.
learnerProfileDetailsAllowed:
  - ""

# Card: What it does. From: the "tool" steps. List each step.
steps:
  - "1. createsa a pic or succint narrative of what the needs of the student are, summary profile introduction"
  - "summarization of student's unique needs , automatically email it to teachers, "
  - "generate stragteis with the teacher to help with the child succeed"

# Card: What it hands back to a person. From: the "person" steps.
# Which decisions stay with people, and with whom?
humanDecisions:
  - decision: "introductioon to summarization of student's unique needs, create a prescriptive unique personalizted list of stragtioes based on lesson that day objectoves class wise"
    madeBy: "teacher"   # e.g. teacher, parent, student

# Card: Who checks it works before anything happens.
# A person who reviews before it reaches the learner or family.
# (Only the format of this field was changed so the file loads; the words are as provided.)
humanReviewer: |-
  caregiver and case manager
  1. caregiver - checks the veracity of intro and needs statemnet
  case manager  - case manager can say thats not gonna be the stragetgy we could procide,. vetting the recommendation stragteies, defines the scope on whats doable in the school setting

# Card: What it produces, and for whom.
# What a person actually receives: a note, a draft, a reminder, a view.
output:
  description: "a draft of personalozed stratgies that can be edited or updated"
  # The fields below are fixed by the workshop rules. Don't change them.
  firstRecipient: "Parent/Caregiver and Case Manager"
  recipientAfterReview: "Teachers and student. acknowledgement from the teacher they received it and if they need any consult or support to address that"
  editableDraft: true
  hideFromLearnerUntilReview: true

# Card: What the student can see, change, or say no to.
learnerControls:
  canSee:
    - "the actual strgatgies, recommedations, introduction"
  canChange:
    - "add to the introduction, add to the stragteies"
  canSayNoTo:
    - "onpy opportunity to edit and revise in conjuction with their caregiver case manager"

# Card: What the family can see, change, or say no to.
familyControls:
  canSee:
    - "the actual strgatgies, recommedations, introduction"
  canChange:
    - "add to the introduction, add to the stragteies"
  canSayNoTo:
    - "parents dont have control over curriculum but they should get an explanation on why they cant say no, they should have inout around stratgies but cant say no"

# Card: What it passes to other helpers. From: Dependencies and the crew sheet handoffs.
dependenciesAndHandoffs:
  - "handoffs - create and generate assignments personalized to the student and their ststaus, modified assignment goes to the teacher first. learner concierge helper - here is the originala ssigne,ent how can i change and mofidy it but still meet the lerning objectives shorten asignment modify it to meet learner needs"
  - "dependent - greeter helper, greeter helper collected information on student condition healyth mood state needs."

# Learner needs the prototype must support, e.g. screen reader, switch access,
# captions, audio, larger text. Only list what the learner or group has stated.
accessibilityNeeds:
  - "speech to text, text to speech, ability to incorprate various reports from different sources, utlize a stragetgy bank, email identified providers, identiofy case manager and caregiver and task solely deisgnmate dto thsoe only"
  - "accessibilutt requests related to the stuident, modifying content into grade level comprehension."
  - "simple and plain language, yes no questions only etc"

# Card: It must never. At least three. Note which role said each one.
mustNever:
  - rule: "never share ifnormation without Case manager and caregiver authorizaton"
    raisedBy: "case manager and caregiver"   # e.g. student, parent, teacher
  - rule: "never proceed with additionbal teacher prescriptive interventions without acknowlegememts by the teacher."
    raisedBy: "teachers"
  - rule: "if student feels its not working go back to the drawing baord"
    raisedBy: "student"

# Situations to try with the prototype. Claude Code turns these into tests.
tests:
  expectedCase: "a teacher from another wschool requests information about the stduent, a coach from a private like kumon asks for the information"             # A normal situation where the helper should work.
  missingOrUncertainInput: ""  # Something is missing or unclear: it should ask, not guess.
  boundaryCase: ""             # Tries to break one "must never" rule: it should refuse.
